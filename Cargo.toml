[package]
name = "seldon-vault-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Moteur local d'embeddings, d'indexation et de recherche multimodale, 100 % Rust std."
publish = false

# Contrat « zéro crate » : aucune section [dependencies], [dev-dependencies]
# ni [build-dependencies]. Seuls std et core::arch sont autorisés.
# Vérification : cargo tree --edges normal,build,dev ne doit afficher que la
# crate racine.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
