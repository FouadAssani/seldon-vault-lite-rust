[package]
name = "seldon-vault-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local multimodal embedding, indexing, and search engine, 100% Rust std."
publish = false

# "Zero crate" contract: no [dependencies], [dev-dependencies],
# or [build-dependencies] section. Only std and core::arch are allowed.
# Verification: cargo tree --edges normal,build,dev must show only the
# root crate.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Tests run the full scalar forward pass on the frozen model. Optimizing the
# test profile keeps the parity suite practical without changing the release
# artifact.
[profile.test]
opt-level = 2
